<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot License Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">🤖 Bot License Manager</h1>
            <div class="text-sm text-gray-500">FastAPI Server Running</div>
        </header>

        <!-- Generator Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">🔑 Generate New Key</h2>
            <div class="flex flex-wrap gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Duration (Days)</label>
                    <input type="number" id="days" value="30" class="w-32 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Memo (Customer Name)</label>
                    <input type="text" id="memo" placeholder="Company A" class="w-64 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="generateKey()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition duration-200">
                    Generate
                </button>
            </div>
            
            <div id="new-key-result" class="mt-4 hidden p-4 bg-green-50 border border-green-200 rounded-md">
                <p class="text-green-800 font-semibold">Key Generated:</p>
                <div class="flex items-center gap-2 mt-1">
                    <code id="generated-key-text" class="text-2xl font-mono text-blue-800 select-all"></code>
                    <button onclick="copyToClipboard()" class="text-gray-500 hover:text-gray-700 text-sm underline">Copy</button>
                </div>
            </div>
        </div>

        <!-- List Section -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-700">📋 License List</h2>
                <button onclick="loadLicenses()" class="text-sm text-blue-600 hover:underline">Refresh</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Key</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Memo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Days</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">HWID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created At</th>
                        </tr>
                    </thead>
                    <tbody id="license-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = ""; // Relative path

        async function loadLicenses() {
            try {
                const res = await axios.get('/admin/list');
                const tbody = document.getElementById('license-table-body');
                tbody.innerHTML = '';
                
                res.data.forEach(lic => {
                    let statusColor = 'bg-gray-100 text-gray-800';
                    if(lic.status === 'active') statusColor = 'bg-green-100 text-green-800';
                    if(lic.status === 'expired') statusColor = 'bg-red-100 text-red-800';
                    if(lic.status === 'revoked') statusColor = 'bg-red-100 text-red-800 line-through';

                    const row = `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap font-mono text-sm font-medium text-gray-900 select-all">${lic.key}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">
                                    ${lic.status}
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${lic.memo || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${lic.days_valid} days</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-mono text-xs">${lic.hwid || 'Not Bound'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(lic.created_at).toLocaleString()}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error(err);
                alert("Failed to load licenses");
            }
        }

        async function generateKey() {
            const days = document.getElementById('days').value;
            const memo = document.getElementById('memo').value;
            
            try {
                const res = await axios.post('/admin/generate', {
                    days_valid: parseInt(days),
                    memo: memo,
                    count: 1
                });
                
                const newKey = res.data[0].key;
                document.getElementById('generated-key-text').innerText = newKey;
                document.getElementById('new-key-result').classList.remove('hidden');
                loadLicenses();
            } catch (err) {
                console.error(err);
                alert("Failed to generate key");
            }
        }

        function copyToClipboard() {
            const keyText = document.getElementById('generated-key-text').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("Key copied to clipboard!");
            });
        }

        // Load on start
        loadLicenses();
    </script>
</body>
</html>
